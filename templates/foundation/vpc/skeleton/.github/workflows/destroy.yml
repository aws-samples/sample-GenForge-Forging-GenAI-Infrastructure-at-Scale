name: Destroy VPC Infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm destruction of all resources'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ values.awsRegion }}

jobs:
  destroy:
    name: Destroy CDK Stack
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'

    steps:
      - name: Validate confirmation
        run: |
          if [ "{% raw %}${{ github.event.inputs.confirm }}{% endraw %}" != "destroy" ]; then
            echo "Confirmation input must be 'destroy'. Aborting."
            exit 1
          fi
          echo "Destruction confirmed. Proceeding..."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ values.accountId }}:role/GitHubActionsDeployRole
          role-session-name: GitHubActionsSession
          aws-region: {% raw %}${{ env.AWS_REGION }}{% endraw %}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AWS CDK
        run: npm install -g aws-cdk@2.170.0

      - name: Install Python dependencies
        working-directory: ./cdk
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: CDK Destroy
        working-directory: ./cdk
        run: cdk destroy --force --all
