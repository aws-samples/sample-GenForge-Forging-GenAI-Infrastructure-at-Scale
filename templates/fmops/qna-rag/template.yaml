apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: genforge-qna-rag-template
  title: QnA RAG Pipeline
  description: |
    RAG solution with Bedrock LLMs, OpenSearch Serverless vector store, and document ingestion pipeline:
    - OpenSearch Serverless collection for vector storage
    - Cognito User Pool for authentication
    - S3 bucket for document storage
    - Lambda function for document ingestion (chunking, embedding, indexing)
    - Lambda function for query handling (embed, search, augment, generate)
    - IAM roles with least-privilege Bedrock and OpenSearch access
  tags:
    - genforge
    - generative-ai
    - aws
    - bedrock
    - rag
    - opensearch
    - fmops
spec:
  owner: platform-team
  type: fmops

  parameters:
    - title: Component Information
      required:
        - name
        - owner
      properties:
        name:
          title: Component Name
          type: string
          description: Unique name for your RAG pipeline
          ui:autofocus: true
          pattern: '^[a-z0-9-]+$'
          maxLength: 50
        description:
          title: Description
          type: string
          description: Brief description of this RAG pipeline
        owner:
          title: Owner
          type: string
          description: Team that owns this component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: AWS Configuration
      required:
        - awsRegion
        - awsAccountId
        - environment
      properties:
        awsRegion:
          title: AWS Region
          type: string
          description: AWS region for deployment
          default: us-east-1
          enum:
            - us-east-1
            - us-west-2
            - eu-west-1
          enumNames:
            - US East (N. Virginia)
            - US West (Oregon)
            - EU (Ireland)
        awsAccountId:
          title: AWS Account
          type: string
          description: Target AWS account for deployment
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Resource
              spec.type: aws-account
        environment:
          title: Environment
          type: string
          description: Deployment environment
          default: dev
          enum:
            - dev
            - staging
            - prod
          enumNames:
            - Development
            - Staging
            - Production

    - title: Network Configuration
      required:
        - vpcId
        - privateSubnetIds
      properties:
        vpcId:
          title: VPC ID
          type: string
          description: VPC for Lambda functions
          pattern: '^vpc-[a-z0-9]+$'
        privateSubnetIds:
          title: Private Subnet IDs
          type: string
          description: Comma-separated private subnet IDs
          pattern: '^subnet-[a-z0-9]+(,\s*subnet-[a-z0-9]+)*$'
        opensearchVpcEndpointId:
          title: OpenSearch Serverless VPC Endpoint ID (optional)
          type: string
          description: |
            Optional. If provided, this existing OpenSearch Serverless VPC endpoint
            will be used for network access. If left blank, a new VPC endpoint will
            be created in the specified private subnets. Public access is always
            disabled.
          default: ''
          pattern: '^(vpce-[a-z0-9]+)?$'

    - title: Model Configuration
      required:
        - bedrockModelId
        - embeddingModelId
      properties:
        bedrockModelId:
          title: Bedrock LLM Model
          type: string
          description: Bedrock model for answer generation
          default: anthropic.claude-3-sonnet-20240229-v1:0
          enum:
            - anthropic.claude-3-sonnet-20240229-v1:0
            - anthropic.claude-3-haiku-20240307-v1:0
            - anthropic.claude-instant-v1
            - amazon.titan-text-express-v1
            - cohere.command-text-v14
          enumNames:
            - Claude 3 Sonnet
            - Claude 3 Haiku
            - Claude Instant
            - Amazon Titan Text Express
            - Cohere Command
        embeddingModelId:
          title: Embedding Model
          type: string
          description: Model for generating text embeddings
          default: amazon.titan-embed-text-v1
          enum:
            - amazon.titan-embed-text-v1
            - cohere.embed-english-v3
            - cohere.embed-multilingual-v3
          enumNames:
            - Amazon Titan Embed Text v1 (1536 dim)
            - Cohere Embed English v3 (1024 dim)
            - Cohere Embed Multilingual v3 (1024 dim)
        vectorDimensions:
          title: Vector Dimensions
          type: integer
          description: Dimension of embedding vectors (must match embedding model)
          default: 1536
          enum:
            - 384
            - 768
            - 1024
            - 1536

    - title: OpenSearch Configuration
      properties:
        collectionName:
          title: Collection Name
          type: string
          description: Name for the OpenSearch Serverless collection
          default: rag-vectors
          pattern: '^[a-z0-9-]+$'
          maxLength: 32
        vectorIndexName:
          title: Vector Index Name
          type: string
          description: Name for the vector index
          default: document-vectors

    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          awsRegion: ${{ parameters.awsRegion }}
          awsAccountId: ${{ parameters.awsAccountId | parseEntityRef | pick('name') }}
          environment: ${{ parameters.environment }}
          vpcId: ${{ parameters.vpcId }}
          privateSubnetIds: ${{ parameters.privateSubnetIds }}
          opensearchVpcEndpointId: ${{ parameters.opensearchVpcEndpointId }}
          bedrockModelId: ${{ parameters.bedrockModelId }}
          embeddingModelId: ${{ parameters.embeddingModelId }}
          vectorDimensions: ${{ parameters.vectorDimensions }}
          collectionName: ${{ parameters.collectionName }}
          vectorIndexName: ${{ parameters.vectorIndexName }}
          repoUrl: ${{ parameters.repoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: 'GenForge - QnA RAG Pipeline for ${{ parameters.name }}'
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: OpenSearch Console
        icon: cloud
        url: https://${{ parameters.awsRegion }}.console.aws.amazon.com/aos/home?region=${{ parameters.awsRegion }}#opensearch/collections
