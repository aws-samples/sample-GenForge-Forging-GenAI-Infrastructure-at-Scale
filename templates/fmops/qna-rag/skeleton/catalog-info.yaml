apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | default("QnA RAG Pipeline with Bedrock and OpenSearch Serverless") }}
  annotations:
    github.com/project-slug: ${{ values.repoUrl | parseRepoUrl | pick('owner') }}/${{ values.repoUrl | parseRepoUrl | pick('repo') }}
    backstage.io/techdocs-ref: dir:.
    github.com/ci-cd: 'enabled'
  tags:
    - aws
    - genforge
    - bedrock
    - rag
    - opensearch
    - fmops
  links:
    - url: https://${{ values.awsRegion }}.console.aws.amazon.com/aos/home?region=${{ values.awsRegion }}#opensearch/collections
      title: OpenSearch Serverless Console
      icon: cloud
    - url: https://${{ values.awsRegion }}.console.aws.amazon.com/bedrock/home?region=${{ values.awsRegion }}
      title: Bedrock Console
      icon: cloud
spec:
  type: fmops
  lifecycle: production
  owner: ${{ values.owner }}
  system: genforge
  providesApis: []
  dependsOn: []
