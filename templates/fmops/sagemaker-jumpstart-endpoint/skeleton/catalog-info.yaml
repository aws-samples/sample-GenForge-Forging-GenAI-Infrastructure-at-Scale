apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | default("SageMaker JumpStart Foundation Model Endpoint") }}
  annotations:
    github.com/project-slug: ${{ values.repoUrl | parseRepoUrl | pick('owner') }}/${{ values.repoUrl | parseRepoUrl | pick('repo') }}
    backstage.io/techdocs-ref: dir:.
    github.com/ci-cd: 'enabled'
  tags:
    - aws
    - genforge
    - sagemaker
    - jumpstart
    - endpoint
    - fmops
  links:
    - url: https://${{ values.awsRegion }}.console.aws.amazon.com/sagemaker/home?region=${{ values.awsRegion }}#/endpoints
      title: SageMaker Endpoints Console
      icon: cloud
    - url: https://${{ values.awsRegion }}.console.aws.amazon.com/cloudwatch/home?region=${{ values.awsRegion }}#alarmsV2:
      title: CloudWatch Alarms
      icon: dashboard
spec:
  type: fmops
  lifecycle: production
  owner: ${{ values.owner }}
  system: genforge
  providesApis: []
  dependsOn: []
