apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: genforge-sagemaker-jumpstart-endpoint-template
  title: SageMaker JumpStart Endpoint
  description: |
    Deploy pre-trained foundation models from JumpStart as real-time inference endpoints:
    - Access to 400+ pre-trained models (Llama, Falcon, Mistral, etc.)
    - SageMaker Model, EndpointConfig, and Endpoint resources
    - Optional data capture for model monitoring
    - CloudWatch alarms for latency and error monitoring
    - IAM roles with least-privilege permissions
  tags:
    - genforge
    - generative-ai
    - aws
    - sagemaker
    - jumpstart
    - endpoint
    - fmops
spec:
  owner: platform-team
  type: fmops

  parameters:
    - title: Component Information
      required:
        - name
        - owner
      properties:
        name:
          title: Component Name
          type: string
          description: Unique name for your JumpStart endpoint
          ui:autofocus: true
          pattern: '^[a-z0-9-]+$'
          maxLength: 50
        description:
          title: Description
          type: string
          description: Brief description of this endpoint
        owner:
          title: Owner
          type: string
          description: Team that owns this component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group

    - title: AWS Configuration
      required:
        - awsRegion
        - awsAccountId
        - environment
      properties:
        awsRegion:
          title: AWS Region
          type: string
          description: AWS region for deployment
          default: us-east-1
          enum:
            - us-east-1
            - us-west-2
            - eu-west-1
          enumNames:
            - US East (N. Virginia)
            - US West (Oregon)
            - EU (Ireland)
        awsAccountId:
          title: AWS Account
          type: string
          description: Target AWS account for deployment
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Resource
              spec.type: aws-account
        environment:
          title: Environment
          type: string
          description: Deployment environment
          default: dev
          enum:
            - dev
            - staging
            - prod
          enumNames:
            - Development
            - Staging
            - Production

    - title: Model Configuration
      required:
        - jumpstartModelId
        - instanceType
      properties:
        jumpstartModelId:
          title: JumpStart Model ID
          type: string
          description: Model identifier from SageMaker JumpStart catalog
          default: meta-textgeneration-llama-3-8b
        instanceType:
          title: Instance Type
          type: string
          description: Inference instance type (GPU recommended for LLMs)
          default: ml.g5.xlarge
          enum:
            - ml.g5.xlarge
            - ml.g5.2xlarge
            - ml.g5.4xlarge
            - ml.g5.12xlarge
            - ml.g5.48xlarge
            - ml.p4d.24xlarge
          enumNames:
            - ml.g5.xlarge (1x A10G GPU, 24GB)
            - ml.g5.2xlarge (1x A10G GPU, 24GB)
            - ml.g5.4xlarge (1x A10G GPU, 24GB)
            - ml.g5.12xlarge (4x A10G GPU, 96GB)
            - ml.g5.48xlarge (8x A10G GPU, 192GB)
            - ml.p4d.24xlarge (8x A100 GPU, 320GB)

    - title: Endpoint Configuration
      properties:
        initialInstanceCount:
          title: Initial Instance Count
          type: integer
          description: Number of inference instances
          default: 1
          minimum: 1
          maximum: 10
        enableDataCapture:
          title: Enable Data Capture
          type: boolean
          description: Capture inference request/response data to S3
          default: false
        dataCapturePercent:
          title: Data Capture Sampling Percentage
          type: integer
          description: Percentage of requests to capture (1-100)
          default: 10
          minimum: 1
          maximum: 100

    - title: Repository Configuration
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Fetch Base Template
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          awsRegion: ${{ parameters.awsRegion }}
          awsAccountId: ${{ parameters.awsAccountId | parseEntityRef | pick('name') }}
          environment: ${{ parameters.environment }}
          jumpstartModelId: ${{ parameters.jumpstartModelId }}
          instanceType: ${{ parameters.instanceType }}
          initialInstanceCount: ${{ parameters.initialInstanceCount }}
          enableDataCapture: ${{ parameters.enableDataCapture }}
          dataCapturePercent: ${{ parameters.dataCapturePercent }}
          repoUrl: ${{ parameters.repoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: 'GenForge - SageMaker JumpStart Endpoint for ${{ parameters.name }}'
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: private

    - id: register
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
      - title: SageMaker Console
        icon: cloud
        url: https://${{ parameters.awsRegion }}.console.aws.amazon.com/sagemaker/home?region=${{ parameters.awsRegion }}#/endpoints
