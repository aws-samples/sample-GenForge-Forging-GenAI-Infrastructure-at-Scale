apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | default("Amazon Bedrock Model Fine-Tuning Pipeline") }}
  annotations:
    github.com/project-slug: ${{ values.repoUrl | parseRepoUrl | pick('owner') }}/${{ values.repoUrl | parseRepoUrl | pick('repo') }}
    backstage.io/techdocs-ref: dir:.
    github.com/ci-cd: 'enabled'
  tags:
    - aws
    - genforge
    - bedrock
    - fine-tuning
    - fmops
  links:
    - url: https://${{ values.awsRegion }}.console.aws.amazon.com/bedrock/home?region=${{ values.awsRegion }}#/custom-models
      title: Bedrock Custom Models Console
      icon: cloud
    - url: https://${{ values.awsRegion }}.console.aws.amazon.com/states/home?region=${{ values.awsRegion }}
      title: Step Functions Console
      icon: dashboard
spec:
  type: fmops
  lifecycle: production
  owner: ${{ values.owner }}
  system: genforge
  providesApis: []
  dependsOn: []
