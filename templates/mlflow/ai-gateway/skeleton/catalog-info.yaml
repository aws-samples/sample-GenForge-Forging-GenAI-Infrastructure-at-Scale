apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | default("MLflow AI Gateway on ECS Fargate with experiment tracking") }}
  annotations:
    github.com/project-slug: ${{ values.repoUrl | parseRepoUrl | pick('owner') }}/${{ values.repoUrl | parseRepoUrl | pick('repo') }}
    backstage.io/techdocs-ref: dir:.
    github.com/ci-cd: 'enabled'
  tags:
    - aws
    - genforge
    - mlflow
    - fargate
    - gateway
  links:
    - url: https://${{ values.awsRegion }}.console.aws.amazon.com/ecs/v2/clusters?region=${{ values.awsRegion }}
      title: ECS Console
      icon: cloud
    - url: https://${{ values.awsRegion }}.console.aws.amazon.com/ecr/repositories?region=${{ values.awsRegion }}
      title: ECR Console
      icon: docker
spec:
  type: mlflow
  lifecycle: production
  owner: ${{ values.owner }}
  system: genforge
  providesApis: []
  dependsOn: []
